phase:
  name: Qwen3-VL multimodal embedding preflight
  step: stage_42b

inputs:
  case_library: streetscape/data/agent/stage_42_multimodal_case_library/multimodal_case_library.csv.gz

outputs:
  directory: streetscape/data/agent/stage_42b_qwen3vl_embedding_preflight
  report: streetscape/reports/STAGE_42B_QWEN3VL_EMBEDDING_PREFLIGHT.md

model:
  model_id: Qwen/Qwen3-VL-Embedding-2B
  source: https://huggingface.co/Qwen/Qwen3-VL-Embedding-2B
  license: Apache-2.0
  dtype: bfloat16
  output_dimension: 1024
  instruction: Retrieve Nanjing street-view cases with similar active-travel visibility, road-access constraints, and evidence reliability.

runtime:
  device: cuda
  batch_size: 1
  allow_cpu_offload: false
  allow_cpu_fallback: false
  maximum_peak_vram_gib: 7.8

pilot:
  cases_per_label: 2
  minimum_nearest_neighbor_label_accuracy: 0.50

