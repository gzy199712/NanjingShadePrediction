  require_same_fclass: true
  require_same_bridge: true
  require_same_tunnel: true
  require_same_layer: true
  topology_connector_inherits_adjacent_thermal_edge: true
  cross_large_intersection: false
  formal_interpolation_performed: false

unknown_policy: retain_unknown_never_zero_fill

